<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Release Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">GitHub Release Tracker</h1>
                    <p class="text-xs text-slate-400">ردیاب هوشمند نسخه‌های گیت‌هاب</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="adminBtn" onclick="handleAdminClick()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-4 py-2 rounded-xl border border-slate-700 transition flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    <span id="adminBtnText">تنظیمات مدیریت</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Add Repo Form (Admin Only) -->
        <div id="addRepoSection" class="hidden mb-8 bg-slate-800/60 border border-indigo-500/30 rounded-2xl p-5 shadow-xl">
            <h3 class="text-base font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                افزودن ریپوزیتوری جدید
            </h3>
            <form id="repoForm" onsubmit="addRepository(event)" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="repoInput" placeholder="مثال: facebook/react یا owner/repo" required 
                    class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                    افزودن و دریافت
                </button>
            </form>
        </div>

        <!-- Repositories Lists Container -->
        <div class="space-y-10">
            <!-- Releases Section -->
            <div>
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    Releases (نسخه‌های اصلی)
                </h2>
                <div id="releasesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Dynamic Release Cards -->
                </div>
            </div>

            <!-- Pre-releases Section -->
            <div>
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-800 pb-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    Pre-releases (نسخه‌های پیش‌نمایش)
                </h2>
                <div id="preReleasesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Dynamic Pre-release Cards -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/40 py-6 mt-12 text-center text-sm text-slate-400">
        <p>Powered by MHYRshkri</p>
    </footer>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-2">تایید رمز عبور مدیریت</h3>
            <p id="modalDesc" class="text-sm text-slate-400 mb-4">لطفاً رمز عبور خود را وارد کنید:</p>
            <form onsubmit="handleAuthSubmit(event)">
                <input type="password" id="passwordInput" placeholder="رمز عبور..." required 
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 mb-4">
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeAuthModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium px-4 py-2 rounded-xl transition">انصراف</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2 rounded-xl transition">تایید</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD-PlaceholderKeyForDemo",
            authDomain: "githubreleasetracker-35db8.firebaseapp.com",
            projectId: "githubreleasetracker-35db8",
            storageBucket: "githubreleasetracker-35db8.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let isAdmin = false;
        let pendingAction = null;

        // Load Repos on start
        window.addEventListener('DOMContentLoaded', () => {
            loadRepositories();
        });

        async function loadRepositories() {
            try {
                const doc = await db.collection('artifacts').doc('gh-tracker-default').collection('public').doc('data').get();
                let repos = [];
                if (doc.exists && doc.data().repos) {
                    repos = doc.data().repos;
                }
                
                const releasesContainer = document.getElementById('releasesContainer');
                const preReleasesContainer = document.getElementById('preReleasesContainer');
                
                releasesContainer.innerHTML = '';
                preReleasesContainer.innerHTML = '';

                if (repos.length === 0) {
                    releasesContainer.innerHTML = '<p class="text-slate-500 text-sm col-span-full">هیچ ریپوزیتوری ثبت نشده است.</p>';
                    return;
                }

                for (const repoFullName of repos) {
                    await fetchAndRenderRepo(repoFullName);
                }
            } catch (err) {
                console.error("Error loading repos:", err);
            }
        }

        async function fetchAndRenderRepo(fullName) {
            try {
                const res = await fetch(`https://api.github.com/repos/${fullName}/releases`);
                if (!res.ok) throw new Error('Not found');
                const releases = await res.json();
                
                if (releases.length === 0) return;

                const latest = releases[0];
                const isPre = latest.prerelease;
                const container = isPre ? document.getElementById('preReleasesContainer') : document.getElementById('releasesContainer');

                // دکمه حذف فقط در صورت ادمین بودن نمایش داده می‌شود
                const deleteBtnHtml = isAdmin ? `
                    <button onclick="deleteRepo('${fullName}')" class="text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 p-2 rounded-xl text-xs transition flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        حذف
                    </button>
                ` : '';

                const card = document.createElement('div');
                card.className = "bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 flex flex-col justify-between shadow-lg hover:border-slate-600 transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-3 mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${fullName}</span>
                            ${deleteBtnHtml}
                        </div>
                        <h3 class="text-base font-bold text-white mb-1">${latest.name || latest.tag_name}</h3>
                        <p class="text-xs text-slate-400 mb-4">نسخه: <span class="text-slate-200 font-mono">${latest.tag_name}</span></p>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-slate-700/50 text-xs">
                        <span class="text-slate-500">${new Date(latest.published_at).toLocaleDateString('fa-IR')}</span>
                        <a href="${latest.html_url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl transition shadow-md shadow-indigo-600/20">مشاهده در گیت‌هاب</a>
                    </div>
                `;
                container.appendChild(card);
            } catch (err) {
                console.error(`Error fetching ${fullName}:`, err);
            }
        }

        async function handleAdminClick() {
            if (isAdmin) {
                // خروج از حالت ادمین
                isAdmin = false;
                document.getElementById('addRepoSection').classList.add('hidden');
                document.getElementById('adminBtnText').innerText = 'تنظیمات مدیریت';
                document.getElementById('adminBtn').classList.remove('border-indigo-500');
                loadRepositories();
                return;
            }

            // بررسی وجود رمز عبور در دیتابیس
            try {
                const doc = await db.collection('artifacts').doc('gh-tracker-default').collection('public').doc('data').collection('config').doc('auth_vault').get();
                if (!doc.exists) {
                    // رمز وجود ندارد، ایجاد رمز جدید
                    pendingAction = 'create_password';
                    document.getElementById('modalTitle').innerText = 'تعیین رمز عبور مدیریت';
                    document.getElementById('modalDesc').innerText = 'لطفاً یک رمز عبور جدید برای پنل ادمین تعیین کنید:';
                } else {
                    // رمز وجود دارد، ورود به پنل
                    pendingAction = 'login';
                    document.getElementById('modalTitle').innerText = 'ورود به پنل مدیریت';
                    document.getElementById('modalDesc').innerText = 'لطفاً رمز عبور خود را وارد کنید:';
                }
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('authModal').classList.add('flex');
            } catch (err) {
                alert('خطا در اتصال به دیتابیس');
            }
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('authModal').classList.remove('flex');
            document.getElementById('passwordInput').value = '';
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const pass = document.getElementById('passwordInput').value;
            
            if (pendingAction === 'create_password') {
                try {
                    await db.collection('artifacts').doc('gh-tracker-default').collection('public').doc('data').collection('config').doc('auth_vault').set({ password: pass });
                    alert('رمز عبور با موفقیت ثبت شد!');
                    enableAdminMode();
                    closeAuthModal();
                } catch (err) {
                    alert('خطا در ذخیره رمز عبور');
                }
            } else if (pendingAction === 'login') {
                try {
                    const doc = await db.collection('artifacts').doc('gh-tracker-default').collection('public').doc('data').collection('config').doc('auth_vault').get();
                    if (doc.exists && doc.data().password === pass) {
                        enableAdminMode();
                        closeAuthModal();
                    } else {
                        alert('رمز عبور اشتباه است!');
                    }
                } catch (err) {
                    alert('خطا در بررسی رمز عبور');
                }
            }
        }

        function enableAdminMode() {
            isAdmin = true;
            document.getElementById('addRepoSection').classList.remove('hidden');
            document.getElementById('adminBtnText').innerText = 'خروج از مدیریت';
            document.getElementById('adminBtn').classList.add('border-indigo-500');
            loadRepositories();
        }

        async function addRepository(e) {
            e.preventDefault();
            if (!isAdmin) return;
            const inputVal = document.getElementById('repoInput').value.trim();
            if (!inputVal) return;

            try {
                const docRef = db.collection('artifacts').doc('gh-tracker-default').collection('public').doc('data');
                const doc = await docRef.get();
                let repos = [];
                if (doc.exists && doc.data().repos) {
                    repos = doc.data().repos;
                }

                if (repos.includes(inputVal)) {
                    alert('این ریپوزیتوری قبلاً اضافه شده است.');
                    return;
                }

                repos.push(inputVal);
                await docRef.set({ repos }, { merge: true });
                
                document.getElementById('repoInput').value = '';
                loadRepositories();
            } catch (err) {
                alert('خطا در افزودن ریپوزیتوری');
            }
        }

        async function deleteRepo(fullName) {
            if (!isAdmin) return;
            if (!confirm(`آیا از حذف ${fullName} اطمینان دارید؟`)) return;

            try {
                const docRef = db.collection('artifacts').doc('gh-tracker-default').collection('public').doc('data');
                const doc = await docRef.get();
                if (doc.exists && doc.data().repos) {
                    let repos = doc.data().repos;
                    repos = repos.filter(r => r !== fullName);
                    await docRef.set({ repos }, { merge: true });
                    loadRepositories();
                }
            } catch (err) {
                alert('خطا در حذف ریپوزیتوری');
            }
        }
    </script>
</body>
</html>
